<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ASCII Bouquet</title>
<style>
/* VOICE: tender, quiet, nocturnal
   IDEA: a terminal rendering a bouquet in coloured characters
   PICTURE: a wrapped 3D bouquet of ASCII roses that grows, buds and blooms on load
   COLOUR and TYPE: black ground, pink/red/blush petals, green stems, cream wrap, red ribbon; monospace
   LAYOUT: bouquet fills the screen, "I love you" typed beneath, controls fade away */
html,body{margin:0;background:#000;color:#ffd6e7;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
body{overflow-x:hidden}
#hero{position:relative;height:100vh;height:100svh;overflow:hidden}
#stage{position:absolute;inset:0;touch-action:pan-y}
canvas{position:absolute;inset:0;width:100%;height:100%}
#glow{filter:blur(9px) saturate(1.5);opacity:.85}
#cmd{position:absolute;left:16px;top:calc(env(safe-area-inset-top) + 18px);font-size:13px;color:#8fd6a0;transition:opacity 1s}
#cmd.hide{opacity:0}
#msg{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 66px);text-align:center;font-size:clamp(26px,8vw,40px);font-weight:600;letter-spacing:.05em;color:#ffe6f0;text-shadow:0 0 18px #ff3d8b,0 0 4px #ff9cc4;min-height:1.4em;padding:0 18px;white-space:pre-wrap;pointer-events:none}
#msg .cur{display:inline-block;width:.5em;animation:blink 1s steps(1) infinite}
#msg .heart{display:inline-block;color:#ff3d7f;animation:beat 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:0}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
#down{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 16px);text-align:center;font-size:12px;color:#c98aa7;opacity:0;transition:opacity 1.2s;pointer-events:none}
#down.on{opacity:1}
#down b{display:block;font-size:16px;color:#ff8fbf;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
#ui{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 136px);left:12px;right:12px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;transition:opacity .5s}
#ui.hide{opacity:0;pointer-events:none}
#more{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:10px;width:44px;height:44px;padding:0;font-size:18px;opacity:.45;z-index:2}
button{background:rgba(255,120,180,.08);border:1px solid rgba(255,150,200,.4);color:#ffc2dc;font:inherit;font-size:14px;min-height:40px;padding:0 14px;border-radius:999px;cursor:pointer}
button:focus-visible,input:focus-visible,#env:focus-visible{outline:2px solid #ff8fc0;outline-offset:3px}
#editor{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 56px);display:none;gap:8px;z-index:5}
#editor.on{display:flex}
#editor input{flex:1;background:#0d0d0d;border:1px solid #ff7fb3;color:#fff;font:inherit;font-size:16px;padding:0 12px;min-height:44px;border-radius:10px}

/* ---------- mail section ---------- */
#mail{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:60px 20px calc(env(safe-area-inset-bottom) + 60px);box-sizing:border-box;background:radial-gradient(ellipse at 50% 55%,#1f0d3a 0%,#08030f 55%,#000 100%);position:relative;overflow:hidden}
#mail h2{position:relative;z-index:1;transition:opacity .4s;margin:0 0 calc(min(88vw,380px) / 21 * 1.08 * -8.5);font-weight:600;font-size:15px;letter-spacing:.06em;color:#d9bfff;text-shadow:0 0 10px #8f4dff;text-align:center}
#mail .tap{font-size:12px;color:#9a84b8;margin:0;text-align:center;transition:opacity .4s}
#env{position:relative;cursor:pointer;border:0;padding:0;background:none;-webkit-tap-highlight-color:transparent;animation:float 3.2s ease-in-out infinite;color:inherit}
@keyframes float{50%{transform:translateY(-8px) rotate(-1deg)}}
#env.open{animation:none}
#envArt{margin:0;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-weight:600;line-height:1.08;font-size:calc(min(88vw,380px) / 35 / .6);letter-spacing:0;text-align:left;white-space:pre;text-shadow:0 0 8px rgba(160,90,255,.6)}
#envArt .e{color:#c9a3ff}#envArt .f{color:#4a2d78}#envArt .k{color:#8d5fe0}#envArt .p{color:#fff0f6;text-shadow:0 0 8px rgba(255,220,235,.6)}#envArt .r{color:#b98aa0}#envArt .t{color:#ff4f8b}#envArt .s{color:#ff2d63;text-shadow:0 0 10px #ff2d63}
.hearts{position:absolute;inset:0;pointer-events:none}
.hearts span{position:absolute;bottom:-20px;color:#ff4f8b;opacity:0;animation:rise 4s ease-in forwards}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:.9}100%{opacity:0;transform:translateY(-95vh) scale(1.2)}}

/* letter overlay */
#letterWrap{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 16px);background:rgba(0,0,0,.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .5s}
#letterWrap.on{opacity:1;pointer-events:auto}
#letter{position:relative;width:min(100%,520px);max-height:100%;overflow:auto;background:#fff8f2;color:#5b1832;border-radius:6px;padding:30px 24px 22px;box-sizing:border-box;box-shadow:0 30px 80px rgba(255,60,140,.35);transform:translateY(40px) scale(.92) rotate(-1.5deg);transition:transform .7s cubic-bezier(.2,.9,.25,1.15);background-image:repeating-linear-gradient(transparent 0 33px,#f3d6e0 33px 34px);background-position:0 18px}
#letterWrap.on #letter{transform:none}
#letter .body{font-family:"Caveat",cursive;font-size:24px;line-height:34px;white-space:pre-wrap;outline:none;min-height:200px}
#letter .body[contenteditable=true]{background:rgba(255,200,220,.25);border-radius:4px}
#letter .stamp{position:absolute;top:14px;right:16px;font-size:26px;color:#d2245a;transform:rotate(8deg)}
#letter .row{display:flex;gap:8px;justify-content:flex-end;margin:14px -24px -22px;padding:10px 24px 14px;flex-wrap:wrap;position:sticky;bottom:-22px;background:linear-gradient(transparent,#fff8f2 30%)}
#letter .row button{color:#6b3aa8;border-color:#cdb2f0;background:#fff}
#letter .row #lNext{background:#7b4cc9;color:#fff;border-color:#7b4cc9}
#letter .row button[hidden]{display:none}
#letter .pg{font-size:12px;color:#9a7ab8;text-align:center;margin-top:8px}
#letter .body{transition:opacity .25s,transform .25s}
#letter .body.turn{opacity:0;transform:translateX(-18px)}
@media (prefers-reduced-motion:reduce){#msg .heart,#msg .cur,#env,#down b{animation:none}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
</head><body>
<section id="hero">
  <div id="stage"><canvas id="glow"></canvas><canvas id="main"></canvas></div>
  <div id="cmd">$ python3 bouquet.py<span>▌</span></div>
  <button id="more" aria-label="Show controls">⋯</button>
  <div id="ui" class="hide">
    <button id="bBloom">↻ replay</button>
    <button id="bStyle">style: ascii</button>
    <button id="bEdit">✎ message</button>
  </div>
  <div id="msg"></div>
  <div id="down">scroll down, there's something for you<b>⌄</b></div>
</section>
<form id="editor"><input id="inp" maxlength="50" aria-label="Message"><button type="submit">ok</button></form>

<section id="mail">
  <h2>✉ you've got mail</h2>
  <button id="env" aria-label="Open the letter">
    <pre id="envArt" aria-hidden="true"></pre>
  </button>
  <p class="tap" id="tapHint">tap the envelope</p>
  <div class="hearts" id="hearts"></div>
</section>

<div id="letterWrap" role="dialog" aria-modal="true" aria-label="Love letter">
  <article id="letter">
    <div class="stamp">♥</div>
    <div class="body" id="lBody"></div>
    <div class="pg" id="lPg">page 1 of 2</div>
    <div class="row">
      <button id="lPrev">← back</button>
      <button id="lNext">next page →</button>
      <button id="lEdit">✎ edit</button>
      <button id="lClose">close</button>
    </div>
  </article>
</div>
<script>
{
const main=document.getElementById('main'),glow=document.getElementById('glow');
const ctx=main.getContext('2d'),gctx=glow.getContext('2d');
const msgEl=document.getElementById('msg'),ui=document.getElementById('ui'),cmd=document.getElementById('cmd');
let message='I love you';
try{const s=localStorage.getItem('bouquetMsg');if(s)message=s}catch(e){}

const RAMP=" .'`^\",:;Il!i><~+_-?][}{1)(|tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";
const BLOCKS=" ·:░▒▓█";
const STYLES=['ascii','words','blocks'];
let style=0;

const LAYERS=[
 {n:6,L:1.18,W:.52,open:.5,curl:-.45,r0:.10,cup:.55,delay:0,  ph:0},
 {n:6,L:1.00,W:.46,open:.78,curl:-.3,r0:.08,cup:.65,delay:.12,ph:.52},
 {n:5,L:.78, W:.38,open:.85,curl:-.05,r0:.06,cup:.75,delay:.24,ph:.2},
 {n:5,L:.55, W:.30,open:1.12,curl:.25,r0:.04,cup:.8, delay:.36,ph:.9},
 {n:4,L:.36, W:.22,open:1.35,curl:.55,r0:.02,cup:.8, delay:.48,ph:.3},
];
const PAL={
 red:[[255,95,110],[165,8,40]],
 pink:[[255,175,205],[215,40,115]],
 blush:[[255,236,242],[240,140,180]],
 magenta:[[245,120,225],[150,20,140]],
 peach:[[255,205,165],[240,100,115]],
};
const GREEN=[70,180,95],DGREEN=[35,115,60],PAPER=[238,214,186],PAPER2=[200,165,135],RIBBON=[235,40,75];

// bouquet layout: head position, palette, size
const FLOWERS=[
 {p:[0,1.0,-.1],c:'red',s:.46},
 {p:[-.9,.62,0],c:'pink',s:.42},
 {p:[.92,.64,0],c:'blush',s:.42},
 {p:[-.5,.12,-.62],c:'magenta',s:.4},
 {p:[.52,.14,-.6],c:'peach',s:.4},
 {p:[.48,1.3,.45],c:'pink',s:.38},
 {p:[-.5,1.32,.4],c:'blush',s:.38},
 {p:[0,.3,-.8],c:'red',s:.36},
];
FLOWERS.forEach((f,i)=>{
  const [x,y,z]=f.p,r=Math.hypot(x,z),tilt=Math.min(.75,r*.75);
  const b=Math.atan2(z,x);
  let u=[Math.sin(tilt)*Math.cos(b)*.8,Math.cos(tilt),Math.sin(tilt)*Math.sin(b)*.6-.3];{const m=Math.hypot(...u);u=u.map(v=>v/m)}
  const ref=Math.abs(u[2])>.9?[1,0,0]:[0,0,1];
  let e1=[u[1]*ref[2]-u[2]*ref[1],u[2]*ref[0]-u[0]*ref[2],u[0]*ref[1]-u[1]*ref[0]];
  const l=Math.hypot(...e1);e1=e1.map(v=>v/l);
  const e2=[e1[1]*u[2]-e1[2]*u[1],e1[2]*u[0]-e1[0]*u[2],e1[0]*u[1]-e1[1]*u[0]];
  f.B=[e1,u,e2];f.order=i;f.spin=i*1.3;
  const [c0,c1]=PAL[f.c];
  f.cols=LAYERS.map((_,li)=>{const k=li/4;return[c0.map((v,j)=>v+(c1[j]-v)*k*.9),c0.map((v,j)=>v+(c1[j]-v)*Math.min(1,k*.9+.35))]});
});
// baby's breath
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const BREATH=[];
for(let i=0;i<34;i++){const a=rnd()*Math.PI*2,r=.45+rnd()*.75;BREATH.push([Math.cos(a)*r,.05+rnd()*.85,Math.sin(a)*r,rnd()])}

const ease=t=>t<=0?0:t>=1?1:1-Math.pow(1-t,3);
const lerp=(a,b,t)=>a+(b-a)*t;

function petalPt(p,u,v,o){
  const cp=Math.cos(p.phi),sp=Math.sin(p.phi);
  let ic,is;
  if(Math.abs(p.curl)<1e-4){ic=u*Math.cos(p.a0);is=u*Math.sin(p.a0)}
  else{ic=(Math.sin(p.a0+p.curl*u)-Math.sin(p.a0))/p.curl;is=(Math.cos(p.a0)-Math.cos(p.a0+p.curl*u))/p.curl}
  const t=p.a0+p.curl*u,ct=Math.cos(t),st=Math.sin(t);
  const w=p.W*Math.pow(Math.sin(Math.PI*(.06+.86*u)),.6)*(.45+.55*u);
  const lat=v*w;
  const cupd=p.cup*v*v*w+.03*Math.sin(v*7+p.phi*3)*u;
  const rx=p.r0+p.L*ic-cupd*st,ry=p.y0+p.L*is+cupd*ct;
  o[0]=rx*cp-lat*sp;o[1]=ry;o[2]=rx*sp+lat*cp;
}

let W=0,H=0,cw=0,ch=0,cols=0,rows=0,dpr=1,fontPx=10;
let depth,lum,cr,cg,cb,part;
const hero=document.getElementById('hero');
function resize(force){
  const nw=hero.clientWidth,nh=hero.clientHeight;
  if(force!==true&&nw===W&&Math.abs(nh-H)<140)return;
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=nw;H=nh;
  fontPx=Math.max(7,Math.min(11,Math.round(Math.min(W,H*.8)/58)));
  cw=fontPx*.62;ch=fontPx*1.05;
  cols=Math.floor(W/cw);rows=Math.floor(H/ch);
  for(const c of [main,glow]){c.width=W*dpr;c.height=H*dpr}
  ctx.setTransform(dpr,0,0,dpr,0,0);gctx.setTransform(dpr,0,0,dpr,0,0);
  const N=cols*rows;
  depth=new Float32Array(N);lum=new Float32Array(N);cr=new Float32Array(N);cg=new Float32Array(N);cb=new Float32Array(N);part=new Int16Array(N);
}
addEventListener('resize',resize);resize(true);
let heroVis=true;new IntersectionObserver(es=>{heroVis=es[0].isIntersecting}).observe(hero);
const down=document.getElementById('down');

let yawDrag=0,pitch=-.3,startT=performance.now(),dragging=false;
const DIST=7,LX=-.45,LY=.75,LZ=-.5,LN=Math.hypot(LX,LY,LZ);
let cyaw,syaw,cpit,spit,scale,offY;
// current local transform
let TB=null,TP=[0,0,0],TS=1;
let ejX=0,ejY=0,ejS=1,ejC=1,ejSn=0;

function splat(x,y,z,nx,ny,nz,r,g,b,id){
  if(TB){
    const [e1,u,e2]=TB;
    const X=(x*e1[0]+y*u[0]+z*e2[0])*TS+TP[0],Y=(x*e1[1]+y*u[1]+z*e2[1])*TS+TP[1],Z=(x*e1[2]+y*u[2]+z*e2[2])*TS+TP[2];
    const NX=nx*e1[0]+ny*u[0]+nz*e2[0],NY=nx*e1[1]+ny*u[1]+nz*e2[1],NZ=nx*e1[2]+ny*u[2]+nz*e2[2];
    x=X;y=Y;z=Z;nx=NX;ny=NY;nz=NZ;
  }
  const X=x*cyaw+z*syaw,Z=-x*syaw+z*cyaw,Y=y+offY;
  const NX=nx*cyaw+nz*syaw,NZ=-nx*syaw+nz*cyaw;
  const Y2=Y*cpit-Z*spit,Z2=Y*spit+Z*cpit;
  const NY2=ny*cpit-NZ*spit,NZ2=ny*spit+NZ*cpit;
  const pz=DIST+Z2,f=scale*DIST/pz;
  const qx=X*f*ejS,qy=-Y2*f*ejS;
  const cx=((ejX+qx*ejC-qy*ejSn)/cw)|0,cy=((ejY+qx*ejSn+qy*ejC)/ch)|0;
  if(cx<0||cy<0||cx>=cols||cy>=rows)return;
  const i=cy*cols+cx;
  if(pz>=depth[i])return;
  depth[i]=pz;
  const d=Math.abs((NX*LX+NY2*LY+NZ2*LZ)/LN);
  lum[i]=Math.min(1,.22+.78*d+.25*Math.pow(d,12));cr[i]=r;cg[i]=g;cb[i]=b;part[i]=id;
}

const A=[0,0,0],B=[0,0,0],C=[0,0,0];
function surface(p,nu,nv,col0,col1,id){
  const eu=.5/nu,ev=1/nv;
  for(let a=0;a<=nu;a++){
    const u=a/nu;
    const r=lerp(col0[0],col1[0],u),g=lerp(col0[1],col1[1],u),b=lerp(col0[2],col1[2],u);
    for(let k=0;k<=nv;k++){
      const v=-1+k*2/nv;
      petalPt(p,u,v,A);petalPt(p,Math.min(1,u+eu),v,B);petalPt(p,u,Math.min(1,v+ev),C);
      const ux=B[0]-A[0],uy=B[1]-A[1],uz=B[2]-A[2],vx=C[0]-A[0],vy=C[1]-A[1],vz=C[2]-A[2];
      const nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx,nl=Math.hypot(nx,ny,nz)||1;
      const rim=Math.abs(v)>.85?1.12:1;
      splat(A[0],A[1],A[2],nx/nl,ny/nl,nz/nl,Math.min(255,r*rim),Math.min(255,g*rim),Math.min(255,b*rim),id);
    }
  }
}
function sphere(cx,cy,cz,R,col,id,na=8,nb=12){
  for(let a=0;a<=na;a++)for(let k=0;k<nb;k++){
    const ph=-Math.PI/2+a/na*Math.PI,th=k/nb*Math.PI*2;
    const nx=Math.cos(ph)*Math.cos(th),ny=Math.sin(ph),nz=Math.cos(ph)*Math.sin(th);
    splat(cx+nx*R,cy+ny*R,cz+nz*R,nx,ny,nz,col[0],col[1],col[2],id);
  }
}

const BASE=[0,-1.75,0];
function stemPt(f,s,o){
  const P=f.p,Cx=P[0]*.1,Cz=P[2]*.1,Cy=-.3;
  const a=(1-s)*(1-s),b=2*(1-s)*s,c=s*s;
  o[0]=a*BASE[0]+b*Cx+c*P[0];o[1]=a*BASE[1]+b*Cy+c*P[1];o[2]=a*BASE[2]+b*Cz+c*P[2];
}

function buildScene(t){
  let id=1;
  TB=null;
  // wrap (paper cone)
  const wrapE=ease(t/1.1);
  const yBot=-2.35,yTopFull=-.7;
  if(wrapE>0){
    const yTop=lerp(yBot,yTopFull,wrapE);
    const NY=40,NT=70;
    for(let a=0;a<=NY;a++){
      const fy=a/NY;
      for(let k=0;k<NT;k++){
        const th=k/NT*Math.PI*2;
        const scal=.07*Math.sin(th*7)*fy;
        const y=lerp(yBot,yTop+scal,fy),r=lerp(.14,.92,(y-yBot)/(yTopFull-yBot));
        const nx=Math.cos(th),nz=Math.sin(th);
        const fold=.5+.5*Math.cos(th*7);
        const col=PAPER.map((v,j)=>lerp(PAPER2[j],v,.55+.45*fold));
        splat(nx*r,y,nz*r,nx*.9,.42,nz*.9,col[0],col[1],col[2],id);
      }
    }
    id++;
    // ribbon band
    if(wrapE>.55){
      for(let a=0;a<=5;a++){const y=-1.86+a*.025,r=lerp(.14,.92,(y-yBot)/(yTopFull-yBot))+.025;
        for(let k=0;k<90;k++){const th=k/90*Math.PI*2;splat(Math.cos(th)*r,y,Math.sin(th)*r,Math.cos(th),0,Math.sin(th),RIBBON[0],RIBBON[1],RIBBON[2],id)}}
      id++;
      const rb=lerp(.14,.92,(-1.8-yBot)/(yTopFull-yBot))+.03,be=ease((wrapE-.55)/.45);
      for(const sx of [-1,1]){
        const loop={phi:0,a0:.25,curl:2.4,L:.42*be,W:.2,r0:0,cup:.3,y0:0};
        TB=frame([sx,.35,-.55]);TP=[0,-1.8,-rb];TS=1;surface(loop,22,12,RIBBON,[200,25,60],id++);
        const tail={phi:0,a0:.1,curl:.3,L:.5*be,W:.09,r0:0,cup:.2,y0:0};
        TB=frame([sx*.35,-1,-.35]);surface(tail,16,6,RIBBON,[190,20,55],id++);
      }
      TB=null;
      sphere(0,-1.8,-rb-.02,.05,[255,70,100],id++,6,10);
    }
  }
  // leaves peeking out
  const leafE=ease((t-.7)/1.2);
  if(leafE>0)for(let k=0;k<6;k++){
    const p={phi:k/6*Math.PI*2+.4,a0:1.0,curl:-1.1,L:.62*leafE,W:.2,r0:.6,cup:.5,y0:-.95};
    surface(p,20,10,DGREEN,GREEN,id++);
  }
  // stems + heads
  FLOWERS.forEach((f,i)=>{
    const g=ease((t-.6-i*.15)/1.3);
    if(g<=0)return;
    TB=null;
    const S=[0,0,0];
    for(let a=0;a<=50;a++){
      const s=a/50*g;stemPt(f,s,S);
      for(let k=0;k<8;k++){const th=k/8*Math.PI*2;splat(S[0]+.035*Math.cos(th),S[1],S[2]+.035*Math.sin(th),Math.cos(th),0,Math.sin(th),GREEN[0]*.85,GREEN[1]*.85,GREEN[2]*.85,id)}
    }
    id++;
    if(g<.7)return;
    const headE=ease((g-.7)/.3);
    const bl=ease((t-3.4-i*.45)/5.5)*.8;
    const sway=.02*Math.sin(t*1.2+i);
    TB=f.B;TP=[f.p[0]+sway,f.p[1],f.p[2]];TS=f.s*lerp(.35,1,headE)*lerp(.8,1,bl);
    // sepals

function line(x0,y0,x1,y1,cl){
  const n=Math.abs(x1-x0),sx=Math.sign(x1-x0)||1;
  for(let i=0;i<=n;i++){
    const x=x0+i*sx,y=y0+(y1-y0)*(n?i/n:0);
    const s=n?(y1-y0)/n:99;
    if(Math.abs(s)<=1){
      const r=Math.floor(y),f=y-r;
      put(x,r,f<.25?'`':f<.5?'-':f<.75?'.':'_',cl);
    }else{
      const yn=y0+(y1-y0)*(Math.min(n,i+1)/n);
      const lo=Math.min(y,yn),hi=Math.max(y,yn);
      for(let r=Math.round(lo);r<=Math.round(hi);r++)put(x,r,(s>0)===(sx>0)?'\\':'/',cl);
    }
  }
}
const notchY=x=>T+7*(1-Math.abs(x-MID)/MID);
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function drawEnv(d,rise,seal){
  G=Array.from({length:EH},()=>Array(EW).fill(' '));Cc=Array.from({length:EH},()=>Array(EW).fill(''));
  if(d<0){
    for(let y=Math.floor(T+d);y<T;y++){const h=(y-(T+d))/(-d),hw=MID*h;for(let x=0;x<EW;x++)if(Math.abs(x-MID)<=hw)put(x,y,':','k')}
    line(0,T-.01,MID,T+d,'e');line(EW-1,T-.01,MID,T+d,'e');
  }
  const lt=Math.round(T+1-rise),lx0=5,lx1=29;
  const vis=(x,y)=>y<T||y<notchY(x);
  for(let y=lt;y<=BOT;y++)for(let x=lx0;x<=lx1;x++){
    if(!vis(x,y))continue;
    let c=' ',cl='p';
    if(y===lt)c=(x===lx0||x===lx1)?'.':'-';
    else if(x===lx0||x===lx1)c='|';
    else if((y-lt)%2===0){c='_';cl='r'}
    put(x,y,c,cl);
  }
  if(rise>3)[...'for you ♥'].forEach((ch,i)=>put(MID-4+i,lt+1,ch,'t'));
  for(let y=T;y<=BOT;y++)for(let x=0;x<EW;x++){
    if(y<notchY(x))continue;
    put(x,y,(x+y)%3===0?'.':' ','f');
  }
  for(let y=T;y<=BOT;y++){put(0,y,'|','e');put(EW-1,y,'|','e')}
  for(let x=1;x<EW-1;x++)put(x,BOT,'_','e');
  if(d>=0)for(let x=1;x<EW-1;x++)put(x,T-1,'_','e');
  line(0,T,MID,T+7,'e');line(EW-1,T,MID,T+7,'e');
  line(1,BOT,MID-1,T+9,'e');line(EW-2,BOT,MID+1,T+9,'e');
  if(d>=0){
    for(let y=T;y<T+d;y++){const h=1-(y-T)/d,hw=MID*h;for(let x=1;x<EW-1;x++)if(Math.abs(x-MID)<hw)put(x,y,':','k')}
    if(d>.5){line(0,T,MID,T+d,'e');line(EW-1,T,MID,T+d,'e')}
    if(seal){const y=Math.round(T+d);put(MID-1,y,'(','s');put(MID,y,'♥','s');put(MID+1,y,')','s')}
  }
  let h='';
  for(let y=0;y<EH;y++){let cur=null,buf='';
    for(let x=0;x<EW;x++){const cl=Cc[y][x];if(cl!==cur){if(cur!==null)h+=cur?`<span class="${cur}">${esc(buf)}</span>`:esc(buf);cur=cl;buf=''}buf+=G[y][x]}
    h+=cur?`<span class="${cur}">${esc(buf)}</span>`:esc(buf);h+='\n'}
  envArt.innerHTML=h;
}
drawEnv(8,0,true);
function animate(from,to,ms,fn,done){
  const t0=performance.now();
  (function step(now){const k=Math.min(1,Math.max(0,(now-t0)/ms)),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;fn(from+(to-from)*e);if(k<1)requestAnimationFrame(step);else if(done)done()})(t0);
}
let opening=false;
env.addEventListener('click',()=>{
  if(opening)return;opening=true;showPage(0,false);
  env.classList.add('open');tapHint.style.opacity=0;mailH.style.opacity=0;
  drawEnv(8,0,false);
  setTimeout(()=>animate(8,-8,700,d=>drawEnv(d,0,false),()=>{
    burst();
    animate(0,10,900,r=>drawEnv(-8,r,false),()=>setTimeout(()=>{wrap.classList.add('on');document.getElementById('lClose').focus({preventScroll:true})},350));
  }),250);
});
function closeLetter(){
  if(lBody.isContentEditable)toggleEdit();
  wrap.classList.remove('on');
  setTimeout(()=>animate(10,0,600,r=>drawEnv(-8,r,false),()=>animate(-8,8,600,d=>drawEnv(d,0,d>7.5),()=>{
    drawEnv(8,0,true);env.classList.remove('open');tapHint.style.opacity=1;tapHint.textContent='tap to read it again';mailH.style.opacity=1;opening=false})),450);
}
document.getElementById('lClose').onclick=closeLetter;
wrap.addEventListener('click',e=>{if(e.target===wrap)closeLetter()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&wrap.classList.contains('on'))closeLetter()});
function toggleEdit(){
  const on=!lBody.isContentEditable;
  lBody.contentEditable=on?'true':'false';
  lEdit.textContent=on?'✓ save':'✎ edit';
  if(on){lBody.focus()}
  else{pages[page]=lBody.innerText.trim()||DEFAULTS[page];lBody.textContent=pages[page];try{localStorage.setItem('bqLetterP'+(page+1),pages[page])}catch(e){}}
}
lEdit.onclick=toggleEdit;
}
